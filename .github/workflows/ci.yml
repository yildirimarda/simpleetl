name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # --all-extras so mypy can see the optional imports (duckdb, polars,
        # prometheus_client, opentelemetry, ...). --python overrides the
        # repo's .python-version (3.14).
        run: uv sync --frozen --all-extras --python 3.11

      - name: Install type stubs
        run: uv pip install pandas-stubs types-PyYAML types-xmltodict

      # --no-sync everywhere: a bare `uv run` re-syncs the venv from
      # .python-version and DROPS the extras installed above.
      - name: Run ruff (lint)
        run: uv run --no-sync ruff check src/ tests/

      - name: Run ruff (format check)
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Run mypy
        run: uv run --no-sync mypy src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --python: override the repo's .python-version (3.14) so the matrix
        # actually tests what it claims. --all-extras: metrics.py imports
        # prometheus_client (monitoring extra) at module level and tests
        # exercise otel/polars/kafka/... extras.
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Run tests with coverage
        # --no-sync: keep the venv exactly as the sync step built it
        run: uv run --no-sync pytest --cov=src --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: simpleetl:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image runs
        run: |
          docker run --rm simpleetl:${{ github.sha }} --help
          docker run --rm simpleetl:${{ github.sha }} --version
          docker run --rm simpleetl:${{ github.sha }} --detect-platform
          docker run --rm simpleetl:${{ github.sha }} --list-formats

      - name: Run ETL job inside Docker image
        run: |
          # Pre-create the output mount: if Docker creates it, it's owned by
          # root and the container's non-root user (uid 1000) cannot write
          mkdir -p tmp_output && chmod 777 tmp_output
          docker run --rm \
            -v ${{ github.workspace }}/configs:/app/configs:ro \
            -v ${{ github.workspace }}/examples/input:/app/examples/input:ro \
            -v ${{ github.workspace }}/tmp_output:/app/tmp_output \
            simpleetl:${{ github.sha }} \
            --config /app/configs/test_e2e.yaml
          # Assert the pipeline actually produced output
          test -s tmp_output/test_output.csv
          echo "output rows: $(wc -l < tmp_output/test_output.csv)"

  e2e:
    name: End-to-End Integration Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python 3.11

      - name: Create test output directory
        run: mkdir -p tmp_output

      - name: Run ETL job with simpleetl --config
        run: uv run --no-sync simpleetl --config configs/test_e2e.yaml

      - name: Verify ETL job output
        run: |
          test -f tmp_output/test_output.csv
          echo "Output file exists. Contents:"
          cat tmp_output/test_output.csv

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pip check
        run: uv run --no-sync pip check

      - name: Install pip-audit
        run: uv pip install pip-audit

      - name: Run dependency vulnerability scan
        # --skip-editable: don't audit the local simpleetl package itself.
        # No --strict: it escalates the "skipped editable" warning back into
        # an error. pip-audit still exits non-zero on real vulnerabilities.
        run: uv run --no-sync pip-audit --skip-editable
        continue-on-error: false
